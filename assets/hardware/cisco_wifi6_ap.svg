<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="apBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- AP Ceiling Mount Rounded Enclosure -->
  <rect x="80" y="40" width="340" height="260" rx="35" fill="url(#apBody)" stroke="#94a3b8" stroke-width="3"/>

  <!-- Inner Soft Bevel -->
  <rect x="95" y="55" width="310" height="230" rx="25" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Cisco Logo & Badge -->
  <text x="250" y="110" fill="#0284c7" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="2" text-anchor="middle">CISCO</text>
  <text x="250" y="130" fill="#64748b" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Catalyst 9120AX Series</text>
  <text x="250" y="145" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Wi-Fi 6 (802.11ax) 4x4:4 MU-MIMO</text>

  <!-- Multi-Color Status LED Glow Ring (CAPWAP Associated) -->
  <circle cx="250" cy="205" r="24" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
  <circle cx="250" cy="205" r="16" fill="#10b981" opacity="0.8"/>
  <circle cx="250" cy="205" r="8" fill="#ffffff"/>
  <text x="250" y="250" fill="#047857" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STATUS: CAPWAP CONNECTED</text>
</svg>