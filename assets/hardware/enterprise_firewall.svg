<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <linearGradient id="firewallChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Rack Mount Ears -->
  <rect x="10" y="20" width="40" height="140" rx="3" fill="#334155" stroke="#1e293b"/>
  <circle cx="30" cy="40" r="6" fill="#0f172a" stroke="#64748b"/>
  <circle cx="30" cy="140" r="6" fill="#0f172a" stroke="#64748b"/>
  <rect x="850" y="20" width="40" height="140" rx="3" fill="#334155" stroke="#1e293b"/>
  <circle cx="870" cy="40" r="6" fill="#0f172a" stroke="#64748b"/>
  <circle cx="870" cy="140" r="6" fill="#0f172a" stroke="#64748b"/>

  <!-- Firewall 1U Chassis -->
  <rect x="50" y="25" width="800" height="130" rx="4" fill="url(#firewallChassis)" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Red Accent Trim Bar -->
  <rect x="50" y="25" width="10" height="130" rx="2" fill="#ef4444"/>

  <!-- Brand Label & Model -->
  <rect x="75" y="38" width="160" height="104" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="62" fill="#ef4444" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="1">SECURE FIREWALL</text>
  <text x="90" y="78" fill="#cbd5e1" font-family="sans-serif" font-size="10">Next-Gen Threat Defense</text>
  <text x="90" y="92" fill="#94a3b8" font-family="monospace" font-size="8">IPS • SSL DECRYPT • WAF</text>
  <circle cx="90" cy="115" r="3.5" fill="#22c55e"/>
  <text x="102" y="118" fill="#cbd5e1" font-family="monospace" font-size="7">HA SYNC</text>

  <!-- Management & HA Heartbeat Ports -->
  <rect x="250" y="38" width="150" height="104" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="325" y="55" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">MGMT &amp; HA CLUSTER</text>
  <rect x="270" y="68" width="30" height="36" rx="2" fill="#020617" stroke="#38bdf8"/>
  <text x="285" y="118" fill="#cbd5e1" font-family="monospace" font-size="7" text-anchor="middle">MGMT</text>
  <rect x="330" y="68" width="30" height="36" rx="2" fill="#020617" stroke="#f59e0b"/>
  <text x="345" y="118" fill="#cbd5e1" font-family="monospace" font-size="7" text-anchor="middle">HA-1</text>

  <!-- Security Zones: WAN (Red), DMZ (Orange), LAN (Green) -->
  <rect x="415" y="38" width="410" height="104" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="620" y="55" fill="#cbd5e1" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">SECURITY ZONE INTERFACES (10G SFP+ / 1G RJ45)</text>

  <!-- WAN Ports -->
  <rect x="435" y="68" width="32" height="40" rx="2" fill="#450a0a" stroke="#ef4444"/>
  <circle cx="451" cy="62" r="2" fill="#ef4444"/>
  <text x="451" y="122" fill="#fca5a5" font-family="monospace" font-size="7" text-anchor="middle">WAN 1</text>
  <rect x="475" y="68" width="32" height="40" rx="2" fill="#450a0a" stroke="#ef4444"/>
  <circle cx="491" cy="62" r="2" fill="#ef4444"/>
  <text x="491" y="122" fill="#fca5a5" font-family="monospace" font-size="7" text-anchor="middle">WAN 2</text>

  <!-- DMZ Ports -->
  <rect x="530" y="68" width="32" height="40" rx="2" fill="#451a03" stroke="#f59e0b"/>
  <circle cx="546" cy="62" r="2" fill="#f59e0b"/>
  <text x="546" y="122" fill="#fde68a" font-family="monospace" font-size="7" text-anchor="middle">DMZ 1</text>
  <rect x="570" y="68" width="32" height="40" rx="2" fill="#451a03" stroke="#f59e0b"/>
  <circle cx="586" cy="62" r="2" fill="#f59e0b"/>
  <text x="586" y="122" fill="#fde68a" font-family="monospace" font-size="7" text-anchor="middle">DMZ 2</text>

  <!-- Inside LAN Ports -->
  <rect x="625" y="68" width="32" height="40" rx="2" fill="#064e3b" stroke="#10b981"/>
  <circle cx="641" cy="62" r="2" fill="#10b981"/>
  <text x="641" y="122" fill="#6ee7b7" font-family="monospace" font-size="7" text-anchor="middle">LAN 1</text>
  <rect x="665" y="68" width="32" height="40" rx="2" fill="#064e3b" stroke="#10b981"/>
  <circle cx="681" cy="62" r="2" fill="#10b981"/>
  <text x="681" y="122" fill="#6ee7b7" font-family="monospace" font-size="7" text-anchor="middle">LAN 2</text>
  <rect x="705" y="68" width="32" height="40" rx="2" fill="#064e3b" stroke="#10b981"/>
  <circle cx="721" cy="62" r="2" fill="#10b981"/>
  <text x="721" y="122" fill="#6ee7b7" font-family="monospace" font-size="7" text-anchor="middle">LAN 3</text>
  <rect x="745" y="68" width="32" height="40" rx="2" fill="#064e3b" stroke="#10b981"/>
  <circle cx="761" cy="62" r="2" fill="#10b981"/>
  <text x="761" y="122" fill="#6ee7b7" font-family="monospace" font-size="7" text-anchor="middle">LAN 4</text>
</svg>