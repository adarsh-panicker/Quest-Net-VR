<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#04070e" />
    </linearGradient>

    <!-- Logo Glow Filters -->
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typography Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="linkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="linkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <linearGradient id="tagBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(2, 132, 199, 0.25)" />
      <stop offset="100%" stop-color="rgba(13, 148, 136, 0.25)" />
    </linearGradient>
  </defs>

  <!-- Banner Container -->
  <rect x="0" y="0" width="1000" height="260" rx="16" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Blueprint Background Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="260" />
    <line x1="120" y1="0" x2="120" y2="260" />
    <line x1="190" y1="0" x2="190" y2="260" />
    <line x1="260" y1="0" x2="260" y2="260" />
    <line x1="330" y1="0" x2="330" y2="260" />
    <line x1="400" y1="0" x2="400" y2="260" />
    <line x1="600" y1="0" x2="600" y2="260" />
    <line x1="800" y1="0" x2="800" y2="260" />

    <line x1="0" y1="65" x2="1000" y2="65" />
    <line x1="0" y1="130" x2="1000" y2="130" stroke="rgba(0, 243, 255, 0.12)" stroke-width="1.5" />
    <line x1="0" y1="195" x2="1000" y2="195" />
  </g>

  <!-- Glowing Accent Border Lines -->
  <line x1="0" y1="2" x2="1000" y2="2" stroke="url(#brandGrad)" stroke-width="3" filter="url(#logoGlow)" />

  <!-- ==========================================
       LEFT EMBLEM: VR HEADSET + 3D NETWORK TOPOLOGY
       ========================================== -->
  <g transform="translate(14, 0)">
    <!-- Ambient Halo Glow behind Emblem -->
    <circle cx="120" cy="130" r="85" fill="rgba(0, 243, 255, 0.08)" filter="url(#logoGlow)" />

    <!-- VR Visor Body -->
    <path d="M 50 170 C 50 152, 75 145, 120 145 C 165 145, 190 152, 190 170 C 190 195, 160 205, 120 205 C 80 205, 50 195, 50 170 Z" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
    <path d="M 110 205 Q 120 192 130 205 Z" fill="#070b14" />
    <!-- Visor Horizon Light -->
    <path d="M 60 170 Q 120 162, 180 170" fill="none" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round" filter="url(#logoGlow)" />

    <!-- Isometric Glowing Cable Links -->
    <g stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)">
      <line x1="120" y1="52" x2="62" y2="110" stroke="url(#linkCyan)" stroke-width="4.5" />
      <line x1="120" y1="52" x2="178" y2="110" stroke="url(#linkCyan)" stroke-width="4.5" />
      <line x1="62" y1="110" x2="120" y2="148" stroke="url(#linkGreen)" stroke-width="3.5" />
      <line x1="178" y1="110" x2="120" y2="148" stroke="#8b5cf6" stroke-width="3.5" />
      <line x1="62" y1="110" x2="178" y2="110" stroke="#00f3ff" stroke-width="2.5" stroke-dasharray="6,4" />
    </g>

    <!-- Glowing Data Packets -->
    <circle cx="92" cy="80" r="3.5" fill="#ffffff" filter="url(#logoGlow)" />
    <circle cx="148" cy="82" r="3.5" fill="#00f3ff" filter="url(#logoGlow)" />
    <circle cx="90" cy="128" r="3" fill="#10b981" filter="url(#logoGlow)" />
    <circle cx="150" cy="128" r="3" fill="#ec4899" filter="url(#logoGlow)" />

    <!-- Node 1: Top Cloud WAN -->
    <g transform="translate(120, 52)" filter="url(#logoGlow)">
      <circle cx="0" cy="0" r="19" fill="#090d16" stroke="#38bdf8" stroke-width="2.5" />
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="4" ry="10" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3" fill="#00f3ff" />
    </g>

    <!-- Node 2: Left Firewall Appliance -->
    <g transform="translate(62, 110)" filter="url(#logoGlow)">
      <rect x="-16" y="-16" width="32" height="32" rx="7" fill="#1c1917" stroke="#ef4444" stroke-width="2.5" />
      <path d="M 0 -8 L 8 -5 C 8 4 3 9 0 11 C -3 9 -8 4 -8 -5 Z" fill="#dc2626" />
    </g>

    <!-- Node 3: Right Core Switch -->
    <g transform="translate(178, 110)" filter="url(#logoGlow)">
      <rect x="-18" y="-13" width="36" height="26" rx="6" fill="#06251b" stroke="#10b981" stroke-width="2.5" />
      <path d="M -9 -2 L 9 -2 M 5 -5 L 9 -2 L 5 1" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 9 3 L -9 3 M -5 0 L -9 3 L -5 6" fill="none" stroke="#00f3ff" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Node 4: Bottom Server Blade -->
    <g transform="translate(120, 148)" filter="url(#logoGlow)">
      <rect x="-18" y="-15" width="36" height="30" rx="5" fill="#1e1035" stroke="#a855f7" stroke-width="2.5" />
      <circle cx="-10" cy="-7" r="1.5" fill="#10b981" />
      <line x1="-5" y1="-7" x2="10" y2="-7" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="-10" cy="0" r="1.5" fill="#00f3ff" />
      <line x1="-5" y1="0" x2="10" y2="0" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="-10" cy="7" r="1.5" fill="#10b981" />
      <line x1="-5" y1="7" x2="10" y2="7" stroke="#c084fc" stroke-width="1.2" />
    </g>

    <!-- Central Holographic Core -->
    <circle cx="120" cy="110" r="6" fill="#00f3ff" filter="url(#logoGlow)" />
    <circle cx="120" cy="110" r="2.5" fill="#ffffff" />
  </g>

  <!-- Vertical Divider Separator -->
  <line x1="250" y1="36" x2="250" y2="224" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2" />
  <line x1="250" y1="80" x2="250" y2="180" stroke="#00f3ff" stroke-width="2" filter="url(#logoGlow)" />

  <!-- ==========================================
       RIGHT TYPOGRAPHY & BRANDING
       ========================================== -->
  <g transform="translate(280, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="38" width="220" height="24" rx="12" fill="url(#tagBg)" stroke="#00f3ff" stroke-width="1" />
    <circle cx="14" cy="50" r="4" fill="#10b981" />
    <text x="26" y="54" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#00f3ff" letter-spacing="1.5">WEBXR • META QUEST 2/3/PRO</text>

    <!-- Primary Title: QUEST NETVR -->
    <text x="0" y="112" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#brandGrad)" letter-spacing="2" filter="url(#textGlow)">
      QUEST <tspan fill="#ffffff">NETVR</tspan>
    </text>

    <!-- Subtitle: Full Suite Name -->
    <text x="0" y="146" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">
      3D Network Topology Explorer &amp; Visual Certification Lab
    </text>

    <!-- Description & Track List -->
    <text x="0" y="172" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
      Real Hardware Models • 7-Step Architecture Builder • Live Ping &amp; Health Audit • CCNA/CCNP Academy
    </text>

    <!-- Bottom Feature Tag Pills -->
    <g transform="translate(0, 196)">
      <!-- Tag 1: Pure Static -->
      <rect x="0" y="0" width="138" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="69" y="14.5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#10b981" text-anchor="middle">⚡ ZERO BUILD STEP</text>

      <!-- Tag 2: Three.js r160 -->
      <rect x="146" y="0" width="118" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="205" y="14.5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">🌐 THREE.JS r160</text>

      <!-- Tag 3: CCNA/CCNP -->
      <rect x="272" y="0" width="134" height="22" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="339" y="14.5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#c084fc" text-anchor="middle">🎓 CCNA &amp; CCNP LABS</text>

      <!-- Tag 4: 2D & 3D PDF Blueprint -->
      <rect x="414" y="0" width="144" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="486" y="14.5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="middle">📄 4-PAGE PDF EXPORT</text>

      <!-- Tag 5: 100% Offline -->
      <rect x="566" y="0" width="112" height="22" rx="4" fill="#0f172a" stroke="#00f3ff" stroke-width="1" />
      <text x="622" y="14.5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#00f3ff" text-anchor="middle">🔒 100% OFFLINE</text>
    </g>
  </g>
</svg>
